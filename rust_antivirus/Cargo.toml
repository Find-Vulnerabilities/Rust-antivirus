[package]
name = "rust_antivirus"
version = "0.2.0-enterprise"
edition = "2021"

[dependencies]
regex = "1.10"
eframe = "0.33.0"
egui = "0.33.0"
sysinfo = "0.37.2"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "winbase", "fileapi", "handleapi", "tlhelp32", "winnt", "libloaderapi", "memoryapi", "namedpipeapi", "ioapiset", "minwinbase", "wintrust", "winsvc", "winnt", "impl-default"] }
walkdir = "2.4"
ring = "0.17"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11.8"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
anyhow = "1.0"
hex = "0.4"
rfd = "0.15.4"
ctrlc = "3.2"
rand = "0.8"

# IPC and inter-process communication
bincode = "1.3"

# Cache and data structures
lru = "0.12"
dashmap = "5.5"

# File monitoring
notify = "6.1"

# Parallelism and concurrency
rayon = "1.7"
parking_lot = "0.12"

# Async runtime
tokio = { version = "1", features = ["sync", "time"] }

# Windows-specific
wmi = "0.14"

[lib]
name = "rust_antivirus"
path = "src/lib.rs"

[[bin]]
name = "wenle-antivirus"
path = "src/main.rs"

[[bin]]
name = "yara_test"
path = "src/bin/yara_test.rs"

[[bin]]
name = "yara_scan_example"
path = "src/bin/yara_scan_example.rs"

[[bin]]
name = "memory_monitor"
path = "src/bin/memory_monitor.rs"

[[bin]]
name = "file_monitor"
path = "src/bin/file_monitor.rs"

[[bin]]
name = "yara_integration"
path = "src/bin/yara_integration.rs"

[[bin]]
name = "driver_bridge"
path = "src/bin/driver_bridge.rs"

[[bin]]
name = "test_simple_rules"
path = "src/bin/test_simple_rules.rs"

[[bin]]
name = "test_self_scan"
path = "src/bin/test_self_scan.rs"

[[bin]]
name = "yara_diagnostic"
path = "src/bin/yara_diagnostic.rs"

[build-dependencies]

[features]
# Enterprise edition with YARA support enabled by default
default = []